<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Invitation ❤️</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9ac6,#ffddec);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
max-width:500px;
width:90%;
}

h1{
color:#ff4f8b;
}

button{
padding:15px 25px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
margin:10px;
}

.yes{
background:#ff4f8b;
color:white;
}

#no{
background:#ddd;
position:absolute;
}

.hidden{
display:none;
}

input, select{
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
margin:10px;
width:250px;
}

</style>
</head>

<body>

<div class="card" id="screen1">

<h1>Hey Filip 👀</h1>

<p>I have a very important question...</p>

<button class="yes" onclick="showQuestion()">
Continue ❤️
</button>

</div>

<div class="card hidden" id="screen2">

<h1>Would you go on a date with Ola? ❤️</h1>

<button class="yes" onclick="showCalendar()">
YES 😍
</button>

<button id="no">
NO 😅
</button>

</div>

<div class="card hidden" id="screen3">

<h1>📅 Pick a date</h1>

<p>When are you free in September?</p>

<input type="date"
min="2026-09-01"
max="2026-09-30"
id="date">

<br>

<select id="time">

<option>17:00</option>
<option>18:00</option>
<option>19:00</option>
<option>20:00</option>
<option>21:00</option>

</select>

<br>

<button class="yes" onclick="finish()">
Confirm ❤️
</button>

</div>

<script>

function showQuestion(){
document.getElementById("screen1").classList.add("hidden");
document.getElementById("screen2").classList.remove("hidden");
}

function showCalendar(){
document.getElementById("screen2").classList.add("hidden");
document.getElementById("screen3").classList.remove("hidden");
}

function finish(){

let date=document.getElementById("date").value;
let time=document.getElementById("time").value;

document.body.innerHTML=`

<div class="card">

<h1>🥳 Perfect!</h1>

<p>
Date selected:
</p>

<h2>${date}</h2>

<h2>${time}</h2>

<p>
See you soon Filip ❤️
</p>

</div>

`;

}

const noBtn=document.getElementById("no");

noBtn.addEventListener("mouseover",()=>{

noBtn.style.left=
Math.random()*(window.innerWidth-120)+"px";

noBtn.style.top=
Math.random()*(window.innerHeight-80)+"px";

});

</script>

</body>
</html>
