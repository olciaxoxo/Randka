<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question for Filip ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9ecf,#ffd6e7);
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
text-align:center;
max-width:600px;
width:90%;
}

h1{
color:#ff4d8d;
margin-bottom:20px;
}

p{
font-size:20px;
margin-bottom:25px;
}

button{
border:none;
padding:15px 30px;
font-size:20px;
border-radius:15px;
cursor:pointer;
margin:10px;
}

#yes{
background:#ff4d8d;
color:white;
}

#no{
background:#eee;
position:absolute;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<div class="card" id="screen1">

<h1>Hey Filip 👀</h1>

<p>
I have one very important question...
</p>

<button id="yes" onclick="showQuestion()">
Continue ❤️
</button>

</div>

<div class="card hidden" id="screen2">

<h1>Would you like to go on a date with Ola? ❤️</h1>

<button id="yes" onclick="acceptDate()">
YES 😍
</button>

<button id="no">
NO 😅
</button>

</div>

<script>

function showQuestion(){
document.getElementById("screen1").classList.add("hidden");
document.getElementById("screen2").classList.remove("hidden");
}

function acceptDate(){

document.body.innerHTML=`

<div class="card">

<h1>🥳 Excellent choice!</h1>

<p>
Your reward:
<br><br>
☕🍸 Coffee/drink with Ola
</p>

</div>

`;

}

const noBtn=document.getElementById("no");

noBtn.addEventListener("mouseover",()=>{

noBtn.style.left=
Math.random()*(window.innerWidth-120)+"px";

noBtn.style.top=
Math.random()*(window.innerHeight-70)+"px";

});

</script>

</body>
</html>
